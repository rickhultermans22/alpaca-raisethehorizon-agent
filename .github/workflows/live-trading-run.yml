name: Scheduled live trading run

# Runs the agent autonomously, several times a day on weekdays, and commits its own
# decision log back into the repo. No one has to remember to start it.
#
# AUTONOMY: this workflow runs agent.py with --live. Real (paper) orders get placed on
# schedule, with no human approval step per batch, that's a deliberate choice made for
# this hackathon (2026-08-28), not an oversight. The actual safety net is in the code,
# not in a human reviewing each run: a hard cap on concurrent positions, a duplicate-
# ticker guard, a liquidity check before any order, and conservative sizing (2.5-3% of
# equity per position). See agent.py's own docstring and MAX_POSITIONS.
#
# KICKOFF GATE: the hackathon's contest window starts 2026-08-28 15:00 UTC. A step below
# refuses to run before that, so an early manual trigger (or a misconfigured schedule)
# can't place a real trade before the event has actually started.

on:
  schedule:
    # ~22 minutes apart through the U.S. session, weekdays, at :08/:30/:52 -- NOT
    # '*/22', which resolves to :00/:22/:44 and silently re-includes :00, the exact
    # highest-load slot this was supposed to avoid (found 2026-09-01: a run queued for
    # 20:44 UTC didn't actually fire until 23:12 UTC, a ~2.5h delay, on the very
    # schedule meant to fix that). Every 5 minutes (the platform minimum) would be
    # excessive for a strategy that only meaningfully changes over hours.
    #
    # ROOT CAUSE LOG, for whoever reads this next: the 2026-08-28 through 2026-08-31
    # gap in scheduled runs was NOT a cron-scheduling problem. Two wrong turns were
    # taken chasing that theory (offsetting off :00, then suspecting a stale Alpaca
    # key) before the actual cause surfaced from a manual run's full log: alpaca-mcp-
    # server and its fastmcp dependency were unpinned in requirements.txt, so a fresh
    # CI install silently picked up an incompatible newer release
    # (ModuleNotFoundError: fastmcp.tools.tool) while the locally-cached environment
    # kept working. Fixed by pinning exact versions. Multi-hour delay on top of that
    # (even after the crash was fixed) is a separate, still-partially-open issue:
    # GitHub's own docs only promise best-effort timing for scheduled workflows, not
    # a guarantee, so some slack should always be expected, not just tolerated once.
    - cron: '8,30,52 13-20 * * 1-5'
  workflow_dispatch: {}             # manual "Run workflow" button too

permissions:
  contents: write   # needed to commit the decision log back to the repo

jobs:
  live-run:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to run before the hackathon's kickoff (2026-08-28 15:00 UTC)
        run: |
          now=$(date -u +%s)
          kickoff=$(date -u -d "2026-08-28T15:00:00Z" +%s)
          if [ "$now" -lt "$kickoff" ]; then
            echo "::error::Before kickoff (2026-08-28 15:00 UTC), refusing to run live."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies (via "python -m pip", not bare "pip", guarantees the
          console scripts land next to THIS python's own executable, not some other one
          on PATH; this was the actual root cause of the first two failed runs)
        run: python -m pip install -r requirements.txt

      - name: Write .env (from repo secrets, never committed, .env is gitignored)
        run: |
          echo "ALPACA_API_KEY=${{ secrets.ALPACA_API_KEY }}" >> .env
          echo "ALPACA_SECRET_KEY=${{ secrets.ALPACA_SECRET_KEY }}" >> .env
          echo "ALPACA_PAPER_TRADE=true" >> .env
          echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" >> .env

      - name: Verify the three secrets were actually set (fails here, clearly, not deep in a traceback)
        run: |
          fail=0
          [ -z "${{ secrets.ALPACA_API_KEY }}" ] && echo "::error::ALPACA_API_KEY repo secret is empty/missing" && fail=1
          [ -z "${{ secrets.ALPACA_SECRET_KEY }}" ] && echo "::error::ALPACA_SECRET_KEY repo secret is empty/missing" && fail=1
          [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ] && echo "::error::ANTHROPIC_API_KEY repo secret is empty/missing" && fail=1
          exit $fail

      - name: Verify the alpaca_mcp_server package actually imports (fails here if the
          install itself is broken, before the agent gets a confusing downstream error)
        run: python -c "from alpaca_mcp_server.cli import main; print('import OK:', main)"

      - name: Run the agent, live
        run: python agent.py --live

      - name: Commit the decision log
        run: |
          git config user.name "hackathon-agent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add log/
          git diff --cached --quiet || git commit -m "Scheduled live run $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
